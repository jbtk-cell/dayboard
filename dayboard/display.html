<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Today</title>
<style>
  /* Designed to be read, not used. No buttons, no links, nothing to tap by
     accident, nothing that changes position between refreshes. Light
     background because these screens sit in daylit rooms and older eyes read
     dark-on-light more comfortably there. */
  :root {
    --ink: #1a1a1a;
    --paper: #fbf8f2;
    --quiet: #5a5a5a;
    --rule: #d8d2c6;
  }
  /* Every size is multiplied by --fit, which the script below turns down until
     the day fits on the glass. Nothing may ever be scrolled to: she will not
     scroll, so a sentence below the fold is one the screen did not say. */
  :root { --fit: 1; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    padding: 4vmin;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* margin:auto rather than align-items:center. Centring a flex child that is
     taller than its container overflows in both directions, and the top of it
     -- here, the clock -- cannot be reached at all. */
  main { width: 100%; max-width: min(40ch, 100%); margin: auto; }

  .clock {
    font-size: calc(clamp(3rem, 13vmin, 9rem) * var(--fit));
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .heading {
    font-size: calc(clamp(1.6rem, 6vmin, 4rem) * var(--fit));
    font-weight: 400;
    color: var(--quiet);
    margin-top: 0.2em;
    padding-bottom: 0.5em;
    border-bottom: 3px solid var(--rule);
  }
  ul { list-style: none; margin-top: 0.7em; }
  li {
    font-size: calc(clamp(1.5rem, 5.2vmin, 3.4rem) * var(--fit));
    line-height: 1.35;
    padding: 0.45em 0;
    border-bottom: 1px solid var(--rule);
  }
  li:last-child { border-bottom: none; }
  .empty {
    font-size: calc(clamp(1.3rem, 4.4vmin, 2.8rem) * var(--fit));
    color: var(--quiet);
    margin-top: 1em;
    font-style: italic;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #f2ede3; --paper: #16150f; --quiet: #a9a294; --rule: #3a372e; }
  }
</style>
</head>
<body>
<main>
  <div class="clock" id="clock">&nbsp;</div>
  <div class="heading" id="heading">&nbsp;</div>
  <ul id="lines"></ul>
  <p class="empty" id="empty" hidden>Nothing to show yet today.</p>
</main>

<script>
// Shrink the type until the whole day is on the glass.
//
// A busy day is a long screen, and a long screen on a wall is one she reads the
// top of and never learns the rest of. Everything this project does is about
// not saying more than is true; a line pushed off the bottom is the same defect
// from the other side, because to her it reads as the screen having nothing to
// say about her evening pills.
//
// Shrinking is always the right answer over hiding or scrolling: small and
// present beats large and absent.
function fit() {
  const root = document.documentElement;
  let scale = 1;
  root.style.setProperty('--fit', scale);
  // 0.45 is the floor. Below that it would be too small to read from a chair,
  // and a day that still does not fit at 0.45 is a sign the rules are saying
  // too much, which is a problem to solve in rules.py rather than in CSS.
  while (scale > 0.45 && document.body.scrollHeight > window.innerHeight) {
    scale -= 0.03;
    root.style.setProperty('--fit', scale);
  }
}

// The screen must never show a stale answer as if it were current. If the
// server cannot be reached, the lines are cleared rather than left frozen:
// yesterday's "pill box was opened at 8:15" is worse than a blank screen.
async function refresh() {
  const now = new Date();
  try {
    const res = await fetch('/api/board', { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const board = await res.json();

    // The clock comes from the server, which is also what decides which events
    // count as today. A browser clock could disagree with it, and a screen
    // showing one time next to another time's answers is worse than useless.
    document.getElementById('clock').textContent = board.clock;
    document.getElementById('heading').textContent = board.heading;
    const ul = document.getElementById('lines');
    ul.replaceChildren();
    for (const line of board.lines) {
      const li = document.createElement('li');
      li.textContent = line;
      ul.appendChild(li);
    }
    document.getElementById('empty').hidden = board.lines.length > 0;
    fit();
  } catch (err) {
    // Server unreachable. Clear the lines rather than leave them frozen:
    // this morning's "pill box was opened at 8:15" shown at 9pm is worse than
    // a blank screen. The browser clock is only trusted for the time itself.
    document.getElementById('lines').replaceChildren();
    let h = now.getHours() % 12 || 12;
    document.getElementById('clock').textContent =
      h + ':' + String(now.getMinutes()).padStart(2, '0') +
      (now.getHours() < 12 ? 'am' : 'pm');
    document.getElementById('heading').textContent =
      now.toLocaleDateString(undefined, { weekday: 'long' });
    document.getElementById('empty').hidden = false;
    fit();
  }
}

refresh();
setInterval(refresh, 20000);
// A tablet turned on its side, or a monitor swapped for a bigger one, changes
// what fits.
addEventListener('resize', fit);
</script>
</body>
</html>
