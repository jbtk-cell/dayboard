[project]
name = "dayboard"
version = "1.0.0"
description = "A wall screen that says what has already happened today, and nothing it cannot support"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Home Automation",
]

# The screen, the console and the server are stdlib only, so the thing that runs
# in the house has nothing to install and nothing to keep patched. The bridge
# talks MQTT, which is not in the stdlib, so it is the one extra:
#     uv sync --extra bridge
[project.optional-dependencies]
bridge = ["paho-mqtt>=2.1"]

[project.scripts]
dayboard = "dayboard.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dayboard"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
